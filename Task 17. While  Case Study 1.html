<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaScript</title>
</head>
<body>

<script type="text/javascript">
    counter = 1;
    var total = 0;
    while (counter <= 10){
        var inputUser = prompt('Masukan angka ke- ' + counter);
        var angka = inputUser;
        total += angka;
        counter += 1;
        console.log('Total: ' + counter);
    }
</script>
</body>
</html>
