<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaScript</title>
</head>
<body>

<script type="text/javascript">
    console.log('Menampilkan 10 angka random (1-6): ');

    for(var i = 1; i <= 10; i++){
        var Random = Math.floor(Math.random() * 6) + 1;

        console.log('Angka ke-' + i +' : ' + Random);
    }
</script>
</body>
</html>
