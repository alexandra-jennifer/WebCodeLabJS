<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaScript</title>

</head>
<body>
    <h1>Image Carousel</h1>

    <div>
        <img id="carousel-img" src="" alt="Gambar Carousel">
    </div>

    <button onclick="mundur()">Mundur</button>
    <button onclick="maju()">Maju</button>

<script type="text/javascript">
    const images = [
        "https://machung.ac.id/wp-content/themes/brew-master/images/images-ps/is-bg.jpg",
        "https://machung.ac.id/wp-content/themes/brew-master/images/images-ps/umc-new.jpg",
        "https://machung.ac.id/wp-content/themes/brew-master/images/images-singleinfo/banner-rektorat.jpeg",
    ];

    let index = 0;

    const imgElement = document.getElementById("carousel-img");

       function updateGambar() {
            imgElement.src = images[index];
        }

        function maju() {
            index++;
            if (index >= images.length) {
                index = 0;
            }
            updateGambar();
        }

        function mundur() {
            index--;
            if (index < 0) {
                index = images.length - 1;
            }
            updateGambar();
        }

       updateGambar();

</script>
</body>
</html>
