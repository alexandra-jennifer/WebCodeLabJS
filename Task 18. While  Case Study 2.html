<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaScript</title>
</head>
<body>

<script type="text/javascript">
    var inputUser = 0;
    var total = 0;
    while (inputUser != -1){
        var inputUser = Number(prompt('Masukan angka (kelik -1 untuk berhenti): '));
        
        if(inputUser != -1){
            total += inputUser;
        }
    }
    console.log('Program Berhenti.');
    console.log('Total: ' + total);
</script>
</body>
</html>
